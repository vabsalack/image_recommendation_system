[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "image_recommendation_system"
version = "0.0.1"
description = "A image recommendation system using visual product similarity"
authors = [
  { name = "kittu" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "tqdm",
    "typer",
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["image_recommendation_system"]
include = ["pyproject.toml", "image_recommendation_system/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["image_recommendation_system"]
force-sort-within-sections = true


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
[dependency-groups]
dev = [
    "commitizen>=4.16.3",
    "ruff>=0.15.16",
    "ty>=0.0.46",
]
eda = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "scipy>=1.17.1",
]
ml-dl = [
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]
notebook = [
    "marimo>=0.23.9",
]

# defining the custom index and prevent other packages from using this index (by explicit = true)
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true  # Prevents other packages from using this index

# ensure a specific package installs exclusively from your custom index
[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }

